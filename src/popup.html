<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Capture Studio</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <span class="brand-mark" data-icon="capture" data-size="24"></span
      ><strong>capture<span>studio</span></strong
      ><span class="free-label">ALL FREE</span>
    </header>
    <div class="intro">
      <h1>See the bigger picture.</h1>
      <p>Every pixel. All yours.</p>
    </div>
    <div class="capture-actions">
      <button data-mode="full" class="capture-action primary">
        <span data-icon="full" data-size="23"></span
        ><span
          ><strong>Full page</strong
          ><small>Auto-detect page or email pane</small></span
        ><span data-icon="arrow" data-size="17"></span></button
      ><button data-mode="visible" class="capture-action">
        <span data-icon="visible" data-size="23"></span
        ><span
          ><strong>Visible area</strong
          ><small>Just what’s on your screen</small></span
        ><span data-icon="arrow" data-size="17"></span></button
      ><button data-mode="region" class="capture-action">
        <span data-icon="region" data-size="23"></span
        ><span
          ><strong>Select a region</strong
          ><small>A little more precision</small></span
        ><span data-icon="arrow" data-size="17"></span>
      </button>
      <button data-mode="element" class="capture-action">
        <span data-icon="region" data-size="23"></span
        ><span
          ><strong>Choose an element</strong
          ><small>Capture a card, chart or page section</small></span
        >
      </button>
    </div>
    <div class="delay-field">
      <label for="capture-delay"
        ><span data-icon="clock" data-size="15"></span>Start after</label
      ><select id="capture-delay">
        <option value="0">No delay</option>
        <option value="3">3 seconds</option>
        <option value="5">5 seconds</option>
        <option value="10">10 seconds</option>
      </select>
    </div>
    <div class="delay-field">
      <label for="capture-target">Full-page target</label
      ><select id="capture-target">
        <option value="auto">Auto · page or pane</option>
        <option value="page">Main page only</option>
        <option value="pick">Choose scrolling area</option>
      </select>
    </div>
    <div class="delay-field">
      <label for="capture-bars">Full-page bars</label
      ><select id="capture-bars">
        <option value="smart">Smart placement</option>
        <option value="hide">Hide fixed bars</option>
      </select>
    </div>
    <div class="delay-field">
      <label for="capture-clean">Clean capture</label
      ><input
        type="checkbox"
        id="capture-clean"
        title="Hide hover effects and small floating widgets"
      />
    </div>
    <div class="delay-field">
      <label for="capture-inline">Edit region on page</label
      ><input type="checkbox" id="capture-inline" checked />
    </div>
    <div id="capture-status" role="status" hidden>
      <progress id="capture-progress" max="1" value="0"></progress>
      <p id="status-message"></p>
      <button id="stop-capture">Stop & edit</button>
      <button id="cancel-capture">Cancel capture</button>
    </div>
    <button class="open-studio" id="open-studio">
      <span data-icon="library" data-size="18"></span>Open my studio<span
        data-icon="arrow"
        data-size="16"
      ></span>
    </button>
    <button class="open-studio" id="open-recordings">
      Record screen / camera
    </button>
    <button class="open-studio" id="open-page-tools">
      Page tools & presentation
    </button>
    <button class="open-studio" id="open-guide">Guide & settings</button>
    <footer>
      <span data-icon="shield" data-size="13"></span>On your device. No uploads.
      No limits on features.
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
