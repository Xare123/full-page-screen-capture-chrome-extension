name: Verify Capture Studio
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: capture-studio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e -- --grep-invert 'input →|motion cadence' --fully-parallel --workers=3 --shard=${{ matrix.shard }}/3
      # Cadence is a real-time quality measurement; run without competing encodes.
      - if: matrix.shard == 1
        run: npm run test:e2e -- --grep 'motion cadence' --workers=1
      - if: matrix.shard == 1
        run: npm run test:engines
      - if: matrix.shard == 1
        run: npm run package
      - if: matrix.shard == 1
        run: node scripts/release-smoke.mjs
      - if: matrix.shard == 1
        run: python3 scripts/package-source.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-studio-artifacts-${{ matrix.shard }}
          path: |
            release/
            artifacts/
            playwright-report/
  compression:
    strategy:
      fail-fast: false
      matrix:
        input: [PNG, JPEG, WebP, GIF, AVIF]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e -- tests/e2e/compression-matrix.spec.js --grep '${{ matrix.input }} input →' --workers=3
        env:
          CS_MATRIX_REPORT: artifacts/ci-compression-matrix-${{ matrix.input }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-studio-compression-matrix-${{ matrix.input }}
          path: |
            artifacts/
            test-results/

  text:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e -- tests/e2e/editor-inline.spec.js tests/e2e/editor-text.spec.js tests/e2e/editor-compat.spec.js --workers=3 --fully-parallel
      - run: python3 scripts/package.py
      - run: node scripts/release-smoke.mjs
      - run: python3 scripts/package-source.py
      - run: python3 scripts/package-store.py
      - uses: actions/upload-artifact@v4
        with:
          name: capture-studio-3.1.0
          path: dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-studio-release-files
          path: |
            release/
            artifacts/
            playwright-report/
